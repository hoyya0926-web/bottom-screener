name: daily-screener

on:
  schedule:
    - cron: "3 0 * * *"   # 매일 00:03 UTC = 09:03 KST (코인 일봉 마감 직후). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:       # Actions 탭에서 "Run workflow"로 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Screen and notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python run.py

      - name: Rotate Kakao refresh token
        if: always() && hashFiles('.kakao_refresh_new') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT가 없어 카카오 토큰을 자동 교체하지 못했습니다. 2달 안에 kakao-setup을 다시 실행하세요."
          else
            gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .kakao_refresh_new && echo "카카오 갱신 토큰 교체 완료"
          fi
          rm -f .kakao_refresh_new

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 멈춥니다. 매달 1일 작은 커밋으로 막아 둡니다.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > keepalive.txt
            git config user.name "screener-bot"
            git config user.email "screener-bot@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive $(date -u +%F)" && git push
          fi
